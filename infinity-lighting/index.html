<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7a2227" />
    <meta name="author" content="Infinity Lighting Solutions" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Logo-V2.png" />
    <link rel="apple-touch-icon" href="/Logo-V2.png" />

    <!-- Fonts load faster with an early connection -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Local business / geo signals (site-wide) -->
    <meta name="geo.region" content="US-TX" />
    <meta name="geo.placename" content="Houston" />
    <meta name="geo.position" content="29.5816;-95.7606" />
    <meta name="ICBM" content="29.5816, -95.7606" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ElectricalContractor",
          "@id": "https://inflighting.com/#business",
          "name": "Infinity Lighting Solutions",
          "description": "Commercial LED lighting and full-service electrical contractor serving the Greater Houston area. LED retrofits for parking garages, stairwells, office buildings, hotels, warehouses and parking lots.",

          "logo": "https://inflighting.com/Logo-V2.png",
          "image": "https://inflighting.com/images/garage-night.jpg",
          "telephone": "+1-281-202-4625",
          "email": "mark@inflighting.com",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Richmond",
            "addressRegion": "TX",
            "postalCode": "77407",
            "addressCountry": "US"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": "29.5816",
            "longitude": "-95.7606"
          },
          "areaServed": [
            { "@type": "City", "name": "Houston" },
            { "@type": "City", "name": "Sugar Land" },
            { "@type": "City", "name": "Katy" },
            { "@type": "City", "name": "The Woodlands" },
            { "@type": "City", "name": "Richmond" },
            { "@type": "City", "name": "Spring" }
          ],
          "priceRange": "$$",

            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "08:00",
            "closes": "17:00"
          },
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Commercial LED Lighting Services",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Parking Garage LED Lighting", "url": "https://inflighting.com/parking-garages" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Stairwell LED Lighting", "url": "https://inflighting.com/stairwells" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Office Building LED Lighting", "url": "https://inflighting.com/office-buildings" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Warehouse High Bay LED Lighting", "url": "https://inflighting.com/warehouses" } },

              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Wall Pack & Flood Lighting", "url": "https://inflighting.com/wallpacks-flood" } },

              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Free Commercial Energy Audit", "url": "https://inflighting.com/energy-audit" } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://inflighting.com/#website",
          "url": "https://inflighting.com",
          "name": "Infinity Lighting Solutions",
          "publisher": { "@id": "https://inflighting.com/#business" },
          "inLanguage": "en-US"
        }
      ]
    }

    <!-- Per-page title, description, canonical, Open Graph and JSON-LD are injected here at build time

  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>

</html>
